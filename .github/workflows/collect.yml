name: collect
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore previous record
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data 2>/dev/null; then git archive FETCH_HEAD | tar -x -C data; else echo "no record yet"; fi
      - name: Collect order book
        run: node collector/collect.mjs
      - name: Publish record to the data branch
        run: |
          cd data
          git init -q -b data
          git config user.name "orderbook-collector"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "record $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
